<style>
:root{--bg:#0b0f14;--card:#131a22;--line:#243040;--tx:#f1f5f9;--mut:#a3afbd;--mint:#5eead4;--warn:#fbbf24;--bad:#fb7185;--s1:8px;--s2:13px;--s3:21px;--s4:34px;--s5:55px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top) + var(--s5) + var(--s1)) var(--s3) 132px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s1);margin-bottom:var(--s2)}
.logo{text-align:center;min-width:0}
.logo img{width:56px;height:56px;border-radius:14px;display:block;margin:0 auto}
#tag{text-align:center;letter-spacing:.22em;font-size:10px;line-height:1.2;font-weight:700;color:var(--mint);margin:2px 0 var(--s3);white-space:nowrap}
.chip{min-height:44px}
small,.lbl{color:var(--mut);font-size:13px}
h2{font-size:17px;margin:var(--s3) 0 var(--s2)}
.chip{background:#1a2330;color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:0 var(--s2);min-height:48px;font:inherit;font-size:14px;width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:var(--s2);margin-bottom:var(--s2)}
.tab{display:none}.tab.on{display:block}
#t0.on{display:flex;flex-direction:column}
#hero{order:0}.stt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:6px;align-items:center}.stt span:first-child{font-weight:700;padding:3px 12px;border-radius:99px;background:#0f2a26;color:var(--mint)}.stt.w span:first-child{background:#2a2310;color:var(--warn)}.stt.sz span:first-child{background:#2f1a08;color:#fdba74}.stt.red span:first-child{background:#2d1118;color:#fda4af}.stt span:last-child{color:var(--mut)}.big.w{color:var(--warn)}.big.b{color:var(--bad)}.alert.bad{background:#2d1118;border-color:#7f1d2d;color:#fecdd3}.toast.tw{border-color:var(--bad);background:linear-gradient(135deg,#3a1018,#131a22)}.toast.tw b{color:#fda4af}#kpis{order:0;gap:var(--s2);margin-bottom:var(--s2)}.kp{margin:0}.kl{color:var(--mut);font-size:12px;letter-spacing:.06em;text-transform:uppercase;min-height:2.4em;line-height:1.2;margin-bottom:6px}#ana{order:2}#quick{order:3}#envs{order:4}#hist{order:5}
body[data-m=matin] #quick{order:1}body[data-m=matin] #ana{display:none}
body[data-m=soir] #ana{order:1}
.chips{display:none;gap:var(--s1);flex-wrap:wrap;margin-bottom:var(--s1)}
body[data-m=matin] .chips{display:flex}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.val{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.big{font-size:34px;color:var(--mint);line-height:1.15}
.sub{display:flex;justify-content:space-between;gap:var(--s1);color:var(--mut);font-size:13px;margin-top:6px;flex-wrap:wrap}
.alert{background:#2a2310;border:1px solid #5a4a14;color:#fde68a;border-radius:14px;padding:var(--s1) var(--s2);font-size:14px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
input,select{width:100%;background:#0d1219;color:var(--tx);border:1px solid #33425a;border-radius:12px;padding:0 var(--s2);min-height:48px;margin-bottom:var(--s1);font:inherit}
select.chip{margin:0}
button{font:inherit;cursor:pointer;min-height:48px;border-radius:12px;border:0;padding:0 var(--s2);background:var(--mint);color:#052e2a;font-weight:750}
button.sec{background:#1c2633;color:var(--tx);border:1px solid #33425a}
button.bad{background:#2d1118;color:#fecdd3;border:1px solid #7f1d2d}
button.x{background:none;color:var(--mut);min-width:48px;font-size:18px}
.w100{width:100%}.row{display:flex;gap:var(--s1)}.row>*{flex:1}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bar{height:10px;background:#0d1219;border-radius:99px;overflow:hidden;margin-top:var(--s1)}
.bar i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .5s}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.top{display:flex;justify-content:space-between;gap:var(--s1);font-weight:650}
.top span:last-child:not(:first-child){white-space:nowrap}
.li{display:flex;justify-content:space-between;align-items:center;padding:var(--s1) 0;border-bottom:1px solid var(--line);font-size:15px}
.li:last-child{border:0}.li small{display:block}
.wk{display:flex;align-items:flex-end;gap:6px;height:72px;margin-top:var(--s1)}
.wk i{flex:1;background:var(--mint);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.85}
.q{font-style:italic;color:#cbd5e1;margin-top:var(--s2);font-size:15px}
.ab p{color:#cbd5e1;font-size:15px;margin-bottom:var(--s2)}.ab h3{color:var(--mint);font-size:16px;margin:var(--s2) 0 var(--s1)}
.ab li{margin:0 0 var(--s1) var(--s3);color:var(--mut);font-size:15px}.ab li strong{color:var(--tx)}
.ab .ft{text-align:center;color:#c4b5fd;font-weight:700;font-size:13px;border-top:1px solid var(--line);padding-top:var(--s2)}
#chat{display:flex;flex-direction:column;gap:var(--s1);min-height:38vh;margin-bottom:var(--s2)}
.m{max-width:86%;padding:var(--s1) var(--s2);border-radius:16px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--mint);color:#052e2a}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.cbar{position:sticky;bottom:80px;display:flex;gap:var(--s1);background:var(--bg);padding:var(--s1) 0}
.cbar input{margin:0}




.isl{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:20;background:#000;border:1px solid #2b3644;border-radius:26px;max-width:92vw;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s}
.isl button{background:none;color:var(--tx);display:flex;align-items:center;gap:var(--s1);padding:0 var(--s3);white-space:nowrap;border-radius:26px}
#dot{width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none}#dot.w{background:var(--warn)}#dot.b{background:var(--bad)}
.isl.pop{transform:translateX(-50%) scale(1.08);box-shadow:0 0 0 2px var(--mint),0 0 28px #5eead455}
#isld{display:none;padding:0 var(--s3) var(--s2);font-size:13px;color:var(--mut)}.isl.open #isld{display:block}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 72px);left:var(--s2);right:var(--s2);max-width:490px;margin:auto;z-index:30;background:linear-gradient(135deg,#1e1b4b,#131a22);border:1px solid #8b5cf6;border-radius:16px;padding:var(--s2) var(--s3);box-shadow:0 12px 30px #0009;animation:fio 5s forwards}
.toast b{display:block;color:#d8b4fe;font-size:13px;margin-bottom:4px}.toast span{font-style:italic;color:#e2e8f0;font-size:15px}
@keyframes fio{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.toast{animation:none}}
.bk{background:#0f2a26;border:1px solid #1d5a50;border-radius:14px;padding:var(--s2);margin-bottom:var(--s2);font-size:14px;order:0}.bk .row{margin-top:var(--s1)}.ck{display:flex;gap:var(--s1);align-items:center;min-height:48px;font-size:14px;color:var(--mut)}.ck input{width:24px;height:24px;min-height:24px;margin:0}#mon{order:6}

body{background-image:radial-gradient(at 0 0,#c084fc17,transparent 50%),radial-gradient(at 100% 100%,#34d39912,transparent 50%);background-attachment:fixed}
.fab{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:14px;z-index:25;width:48px;padding:0;border-radius:50%;background:#000;border:1px solid var(--mint);color:var(--mint);font-size:20px;box-shadow:0 0 16px #5eead433}
.cap{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:14px;z-index:24;height:48px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 62px 0 22px;background:#000;border:1px solid #8b5cf6;border-radius:99px;overflow:hidden;opacity:0;pointer-events:none;transform:translateX(14px) scale(.96);transition:opacity .35s,transform .35s cubic-bezier(.16,1,.3,1)}
.cap.on{opacity:1;transform:none}.cap small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.cap b{font-size:17px;line-height:1.1;color:var(--mint)}.cap b.w{color:var(--warn)}.cap b.b{color:var(--bad)}
.cap i{position:absolute;left:20px;right:60px;bottom:0;height:2px;background:linear-gradient(90deg,#c084fc,var(--mint));transform-origin:left;transform:scaleX(0)}
.cap.on i{animation:dr 3s linear forwards}@keyframes dr{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.isl{transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s,opacity .3s}body.cp .isl{opacity:0;pointer-events:none}
#pat{order:5}body[data-m=soir] #pat{order:2}
#pc{width:100%;height:170px;display:block;border-radius:12px;background:#0d1219;margin:var(--s1) 0}
.pt{margin-bottom:var(--s1)}.pt button{padding:0;font-size:14px}.pt button.on{background:var(--mint);color:#052e2a}
.qc{display:flex;gap:var(--s1);overflow-x:auto;margin-bottom:var(--s1);scrollbar-width:none}.qc button{white-space:nowrap;min-height:44px;font-size:13px;flex:none}
.m.a{border-color:#8b5cf655;background:linear-gradient(165deg,#1a162e,#131a22)}
#mic.ls{border-color:var(--bad);animation:pw 1.4s infinite}@keyframes pw{0%{box-shadow:0 0 0 0 #fb718588}70%{box-shadow:0 0 0 14px #fb718500}100%{box-shadow:0 0 0 0 #fb718500}}
@media(prefers-reduced-motion:reduce){#mic.ls,.cap.on i{animation:none}}
#hero .stt{margin-top:0}
.isl:not(.vis):not(.pop){opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%) translateY(-16px);transition:opacity .3s,transform .35s,visibility 0s .35s}
.isl.vis{transform:translateX(-50%)}
#mic{padding:0;flex:none;width:52px;min-height:52px;height:52px;border-radius:50%;overflow:hidden;background:#030519;border:1px solid #8b5cf666;box-shadow:0 0 14px #8b5cf633}
#mic img{width:100%;height:100%;display:block;pointer-events:none}

.ic{display:block;width:36px;height:36px}.ic img{width:100%;height:100%;display:block;pointer-events:none;opacity:.6;filter:saturate(.8);transition:opacity .25s,transform .25s,filter .25s}


.kh{display:flex;align-items:center;gap:var(--s2);margin:var(--s3) 0 var(--s2)}.kh h2{margin:0}.kh .lbl{font-size:13px;line-height:1.35}
.kav{flex:none;width:64px;height:64px;border-radius:50%;background:var(--kymy) center/cover;box-shadow:0 0 18px #22d3ee33,0 0 0 1px #8b5cf655}
.kav.s{display:inline-block;width:22px;height:22px;vertical-align:middle;margin-right:6px;box-shadow:none}
.m.a{position:relative;margin-left:30px}.m.a::before{content:"";position:absolute;left:-30px;top:2px;width:24px;height:24px;border-radius:50%;background:var(--kymy) center/cover}
.logo img{cursor:pointer;filter:drop-shadow(0 0 8px #2de6d655)}
.hzs{height:auto!important;min-height:150px}.hzl{width:min(88vw,390px)!important;height:auto!important;border-radius:0!important;filter:none!important;cursor:pointer}
#spl{position:fixed;inset:0;z-index:99999;background:#0a0a0c;display:none;align-items:center;justify-content:center}#spl.on{display:flex}
.sndr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}.sndr input[type=checkbox]{width:24px;height:24px;flex:none}.sndr .sec:disabled{opacity:.45}
input[type=checkbox],input[type=range]{accent-color:#5eead4}

/* v23 — dock unique : menu orbital + KŸMŸ dans une même capsule */
body .navbg{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 92px);z-index:28;pointer-events:none;background:linear-gradient(to top,#0b0f19 38%,#0b0f1900)}
body .navdock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:36;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:#0e1626f2;border:1px solid #22d3ee55;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 10px 30px #000b,0 0 26px #22d3ee2a}
body .navdock .nsep{width:1px;height:30px;background:#22d3ee33}
body .navdock .nfab,body .navdock .kfab{position:relative;left:auto;right:auto;bottom:auto;transform:none;width:52px;height:52px;margin:0;border-radius:50%;z-index:auto;box-shadow:none;border:0;background-color:transparent}
body .navdock .nfab{color:var(--mint)}
body .navdock .kfab{background:#050818 var(--kymy) center/88% no-repeat;box-shadow:0 0 0 1px #8b5cf666,0 0 16px #22d3ee40}
body .navdock .nfab .ni{width:26px;height:26px}
body.nm .navdock .nfab{background:#22d3ee22;box-shadow:0 0 0 2px #5eead466}
body.kp .navdock,body.kp .navbg{display:none}
body .navdock .kfab.dot::after{top:-1px;right:-1px}
#nmenu{bottom:calc(env(safe-area-inset-bottom) + 46px)}
body .logo{min-width:0;display:flex;justify-content:center}
body .ctl{grid-template-columns:auto auto;grid-template-areas:"l m" "g g";justify-content:space-between;row-gap:2px}
body .ctl #lang{grid-area:l}body .ctl .logo{grid-area:g;margin-top:2px}body .ctl #modeb{grid-area:m}
body .ctl{grid-template-columns:auto auto;justify-content:space-between}body .ctl #lang{justify-self:start;width:auto}body .ctl #modeb{justify-self:end}
body .logo{--lw:clamp(104px,33vw,134px)}body .logo img{width:var(--lw)!important;height:calc(var(--lw)*.5101)!important;max-width:none;max-height:none;flex:none;object-fit:fill;border-radius:0!important}

/* v26 header, greeting, bubble, sound shortcut */
body .ctl{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"l g m";align-items:center;column-gap:8px;row-gap:0;justify-content:stretch}
body .ctl #lang{grid-area:l;justify-self:start;width:auto}
body .ctl .logo{grid-area:g;margin:0}
body .ctl #modeb{grid-area:m;justify-self:end}
body .logo{--lw:clamp(78px,23vw,96px)}
body .hk{display:flex;align-items:center;justify-content:space-between;margin:2px 0 var(--s1)}
body .hkt b{font-size:19px;font-weight:650;letter-spacing:0;color:var(--tx)}
body .sndq{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff0a;border:1px solid var(--line);color:var(--mut)}
body .bub{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:37;width:min(340px,calc(100vw - 32px));max-height:none;overflow:visible;margin:0;padding:12px 16px;opacity:0;pointer-events:none;font-size:14.5px;line-height:1.4;border:1px solid #8b5cf666;border-radius:18px;transition:opacity .3s,transform .3s}
body .bub.on{opacity:1;pointer-events:auto;transform:translateX(-50%);margin:0;padding:12px 16px;max-height:none}
body .bub::after{content:"";position:absolute;bottom:-7px;left:calc(50% + 28px);width:12px;height:12px;background:#0f1626;border-right:1px solid #8b5cf666;border-bottom:1px solid #8b5cf666;transform:rotate(45deg)}
body.kp .bub{display:none}
body .ctl #lang{width:104px;max-width:104px}

/* v27 zone button (mirror of $), user icon */
body .zfab{right:auto;left:14px}
body .zfab .ni{width:22px;height:22px;margin:0}
body .zcap{right:auto;left:14px;align-items:flex-start;padding:0 22px 0 62px;height:auto;min-height:48px;border-radius:24px;transform:translateX(-14px) scale(.96);max-width:calc(100vw - 28px)}
body .zcap.on{transform:none}
body .zcap i{left:62px;right:20px;animation-duration:5s!important}
body .zcap small{white-space:nowrap}body .zcap b{font-size:15px;white-space:nowrap}
body .zcap{padding-top:6px;padding-bottom:8px}
body .hkt{display:flex;flex-direction:column;align-items:flex-start}body .nmadd{min-height:28px;padding:0;font-size:12.5px;color:var(--mint)}
body.nm .bub{display:none}
body .zcap{max-width:calc(100vw - 92px)}
body .zcap b{font-size:14px;white-space:normal;line-height:1.25}
body .zcap small{white-space:normal;line-height:1.3}

/* v28 transparence des boutons flottants pendant le geste */
body .fab,body .navdock,body .navbg{transition:opacity .25s ease}
body.scr .fab,body.scr .navdock,body.scr .navbg,body.fing .fab,body.fing .navdock,body.fing .navbg{opacity:.14}
body.scr .cap.on,body.fing .cap.on{opacity:.14}
@media(prefers-reduced-motion:reduce){body .fab,body .navdock,body .navbg{transition:none}}
body .logo{--lw:clamp(84px,25vw,104px)}
body .logo img{height:calc(var(--lw)*.4023)!important}
body .ctl #lang{width:112px!important;max-width:112px!important;min-width:0;justify-self:start}
@media(max-width:359px){body .ctl #lang{width:88px!important;max-width:88px!important;padding-left:10px;padding-right:22px}body .logo{--lw:78px}body .ctl{column-gap:4px}}
@media(max-width:359px){body .ctl #modeb{white-space:nowrap;padding:0 10px;font-size:13.5px}}
body #fab.dim,body #zfab.dim{opacity:.14}
/* v30 KŸMŸ : nouveau visage, flottaison, salut + clin d'œil, bulle BD néon */
body .navdock .kfab{background:#03060f var(--kymy) center/100% no-repeat;animation:kfloat 3s ease-in-out infinite}
@keyframes kfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

#splq .w{display:inline-block;white-space:nowrap;opacity:0;filter:blur(7px);transform:translateY(5px);background:linear-gradient(180deg,#fff 0%,#c4cfdc 58%,#f4f8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#splw{position:relative;width:min(80vw,480px);opacity:0;--rx:-10%}
#splw img{display:block;width:100%;aspect-ratio:870/350;height:auto;-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--rx) - 10%),transparent calc(var(--rx) + 5%));mask-image:linear-gradient(90deg,#000 calc(var(--rx) - 10%),transparent calc(var(--rx) + 5%))}
#splw .spa,#splw .spr{position:absolute;left:87.9%;top:26%;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
#splw .spa{width:30%;aspect-ratio:1;background:radial-gradient(circle,#d8fdffdd 0,#5eead466 30%,#06b6d400 66%);mix-blend-mode:screen}
#splw .spr{width:18%;aspect-ratio:1;border:1px solid #9ff6ff55}
#splw .spa.go{animation:spla 1.4s ease-out forwards}
#splw .spr.go{animation:sprr 1.3s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spla{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
@keyframes sprr{0%{opacity:.35;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}}
#spls{margin-top:clamp(18px,3.5svh,30px);text-align:center;font-family:'SplF','Inter Display',Inter,system-ui,sans-serif;font-weight:200;opacity:0}
#spls b{display:block;font-weight:200;font-size:clamp(17px,5vw,23px);letter-spacing:.5em;text-indent:.5em;color:#e6eef7}
#spls small{display:block;margin-top:8px;font-weight:200;font-size:clamp(10px,2.8vw,11.5px);letter-spacing:.3em;text-indent:.3em;color:#b4c4d6}
#spl.rm #splw,#spl.rm #spls{opacity:1}#spl.rm #splw{--rx:120%}#spl.rm #splq,#spl.rm #spc{display:none}
/* v40 : aperçu de montant */
small.dech{display:block;min-height:0;margin:2px 4px 0;font-size:13px;font-weight:600;color:#7dd3fc;letter-spacing:.01em}
small.dech:empty{display:none}
/* v40 — À propos : tient sur un écran, même 360×700 */
body:has(#t4.on) main{padding-bottom:0!important}
@media(max-height:820px){#t4 .abw{gap:7px}#t4 .abv{padding:10px 13px;min-height:0}#t4 .abp-r{min-height:38px}#t4 .abpl{gap:4px}#t4 .abpv{gap:3px}#t4 .abz{gap:3px}#t4 .abs{line-height:1.25}#t4 .abb{min-height:40px}}

/* v40b — corrections validées rétablies : logo net (aucune lueur), un seul jeton pour tous les boutons flottants, A.I.R. lisible */
body .logo img,.logo img{filter:none!important;animation:none!important}
body #fab,body #zfab,body #sfab{background:var(--btnbg)!important;border:1px solid var(--btnbd)!important;box-shadow:0 4px 14px #0008!important}
body .navdock{background:var(--btnbg)!important;border:1px solid var(--btnbd)!important;box-shadow:0 4px 14px #0008!important}
body .navdock .kfab,body.bubon .navdock .kfab{box-shadow:none!important}
#t4 .abp-r b{background:#0b2a33;border:1px solid #22d3ee;color:#f8fafc;font-weight:800;font-size:13px}
#t4 .abp-r.on b{background:#22d3ee;border-color:#22d3ee;color:#04141a}
#t4 .abp-r{background:var(--btnbg);border:1px solid var(--btnbd);color:#e6eef7}
#t4 .abp-r.on{background:var(--btnbg);color:#fff;border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
/* v40b — l'infobulle « Régler le son » : jeton commun, et s'efface seule (elle ne masque plus le logo) */
body .sfab::after{background:var(--btnbg);border:1px solid var(--btnbd);animation:sndhint 7s ease forwards}
@keyframes sndhint{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){body .sfab::after{animation:none;opacity:0}}

/* v40c — À propos : A.I.R. remplace Vision/Mission par trois grands choix lisibles */
#t4 .abr.abair{gap:8px}
#t4 .abl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;padding:6px 4px;border-radius:16px;background:var(--btnbg);border:1px solid var(--btnbd);color:#e6eef7}
#t4 .abl b{font-size:24px;line-height:1;font-weight:800;color:#e6f7ff;letter-spacing:.02em}
#t4 .abl span{font-size:clamp(11px,3.1vw,12.5px);font-weight:650;color:#cbd5e1;letter-spacing:.02em}
#t4 .abl.on{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint)}
#t4 .abl.on b{color:var(--mint)}#t4 .abl.on span{color:#fff}
#t4 .abback{align-self:center;min-height:40px;padding:0 14px;background:transparent;border:0;color:#7dd3fc;font-size:13px;font-weight:650;letter-spacing:.03em}
#t4 .abback:focus-visible,#t4 .abl:focus-visible,#t4 .abb:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#t4 .abv .abpv{margin:0}
</style>
</head>

/* Verrou par code (OPTIONNEL, désactivé par défaut) — AES-GCM 256 bits, clé dérivée du code par PBKDF2-SHA256 (310 000 itérations).
   Au repos : données chiffrées dans localStorage. En session : copie en clair dans sessionStorage (effacée à la fermeture ou au verrouillage). */
const VLT={on:false,locked:false,key:null,q:Promise.resolve(),n:0,iter:600000};
try{VLT.on=!!localStorage.getItem(KEY+'_vlt')}catch(e){}
const vb64=u=>{let s='';u.forEach(b=>s+=String.fromCharCode(b));return btoa(s)},vub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const vOK=()=>!!(window.crypto&&crypto.subtle);
async function vDerive(code,salt,iter){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(code)),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function vEnc(key,txt){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(txt)));return 'enc1:'+vb64(iv)+'.'+vb64(ct)}
async function vDec(key,blob){const p=String(blob).slice(5).split('.');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:vub(p[0])},key,vub(p[1])))}
async function vKey(){if(VLT.key)return VLT.key;const j=sessionStorage.getItem(KEY+'_vk');if(!j)return null;VLT.key=await crypto.subtle.importKey('jwk',JSON.parse(j),{name:'AES-GCM'},true,['encrypt','decrypt']);return VLT.key}
function vltWrite(j){
 if(!VLT.on){localStorage.setItem(KEY,j);return}
 if(VLT.locked)return;
 sessionStorage.setItem(KEY+'_sess',j);
 const n=++VLT.n;VLT.q=VLT.q.then(async()=>{const k=await vKey();if(!k||n<VLT.n)return;const c=await vEnc(k,j);if(!VLT.on||n<VLT.n)return;localStorage.setItem(KEY,c)}).catch(()=>{})}

function guessCur(){const r=((navigator.language||'').split('-')[1]||'').toUpperCase(),f=CT.find(x=>x[0]===r);return f?{c:f[1],cc:r}:(L===1?{c:'USD',cc:'US'}:{c:'EUR',cc:'FR'})}

function tdy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mlLeft(end){const [y,m]=end.split('-').map(Number),d=new Date();return Math.max(0,(y-d.getFullYear())*12+(m-1-d.getMonth()))}
function solveR(l){const n=mlLeft(l.end);if(n<=0||l.pay*n<=l.bal)return 0;let lo=1e-9,hi=.05;for(let i=0;i<70;i++){const m=(lo+hi)/2,v=l.pay*(1-Math.pow(1+m,-n))/m;if(v>l.bal)lo=m;else hi=m}return (lo+hi)/2}

function fin(o){o.fixedItems=Array.isArray(o.fixedItems)?o.fixedItems:[];o.loans=Array.isArray(o.loans)?o.loans:[];o.income=+o.income||0;o.created=o.created||tdy();o.lastBackup=o.lastBackup??null;o.snooze=o.snooze||'';o.cur=o.cur||guessCur();o.due=Object.assign({lead:3},o.due||{});o.ob=o.ob||0;o.profile=Object.assign({first:'',last:'',pref:'',style:'friendly'},o.profile||{});o.showBal=!!o.showBal;o.paid=o.paid&&typeof o.paid==='object'?o.paid:{};o.goals=Array.isArray(o.goals)?o.goals:[];o.planned=Array.isArray(o.planned)?o.planned:[];o.alertSeen=o.alertSeen&&typeof o.alertSeen==='object'?o.alertSeen:{};
 o.loans.forEach(l=>{l.day=l.day||15;l.init=l.init||l.bal;l.end=l.end||null;l.auto=!!l.auto;if(BUILD==='personal')l.n=l.n.replace(/\s*\((19|20)\d\d\)\s*$/,'');l.lastPay=l.lastPay||tdy().slice(0,7);if(l.r==null)l.r=loanR(l)});o.fixed=fixedSum(o);return o}

const CURI=()=>{const c=S.cur||{c:'USD'};if(c.c==='XXX')return{sym:c.sym||'¤',dig:c.dig??2,scale:1,code:'XXX'};const d=CD[c.c]||CD.USD;return{sym:d[0],dig:d[1],scale:d[2],code:c.c}};
const fmtN=v=>Math.round(v).toLocaleString(LOC[L]);
function regionName(cc){try{return new Intl.DisplayNames([LOC[L]],{type:'region'}).of(cc)}catch(e){return cc}}
const flag=cc=>String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt()));
function curOptions(){const sel=S.cur.c==='XXX'?'XXX':S.cur.cc;return CT.map(([cc,c])=>({cc,c,n:regionName(cc)})).sort((a,b)=>a.n.localeCompare(b.n,LOC[L])).map(o=>`<option value="${o.cc}"${o.cc===sel?' selected':''}>${flag(o.cc)} ${esc(o.n)} · ${esc(CD[o.c][0])}</option>`).join('')+`<option value="XXX"${sel==='XXX'?' selected':''}>🌍 ${t('cur_other')}</option>`}
function setCountry(v){if(v==='XXX'){const s=prompt(t('cur_sym'),S.cur.sym||'');if(s&&s.trim())S.cur={c:'XXX',cc:'XXX',sym:s.trim().slice(0,5),dig:2}}else{const f=CT.find(x=>x[0]===v);if(f)S.cur={c:f[1],cc:v}}save()}
function renderLite(){document.body.dataset.m=mode();applyLang();renderBudget();renderLoans();renderInc();renderAbout();isl();extra();if(curTab()===6)renderTx();if(curTab()===7)renderObj()}
const recalc=()=>{S.fixed=fixedSum(S);save()};
/* --- charges fixes (éditeur partagé réglages / onboarding) --- */
function fxRows(){return S.fixedItems.map((x,k)=>`<div class="fxr"><input class="fn" data-k="${k}" aria-label="${t('fx_name')}" value="${esc(x.n)}" placeholder="${t('fx_name')}"><input class="fa" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" data-dec="1" aria-label="${t('fx_amt')}" value="${x.a||''}" placeholder="0"><input class="fd" data-k="${k}" type="number" inputmode="numeric" min="1" max="31" aria-label="${t('rm_day')}" value="${x.day||''}" placeholder="${t('rm_day_s')}"><button type="button" class="x" data-fxdel="${k}" aria-label="${t('delb')}">✕</button></div>`).join('')}
function fxBind(root,again){root.querySelectorAll('.fxr input').forEach(i=>i.onchange=()=>{const x=S.fixedItems[+i.dataset.k];if(!x)return;if(i.classList.contains('fn'))x.n=i.value.trim();else if(i.classList.contains('fa'))x.a=Math.max(0,parseFloat(i.value)||0);else{const d=parseInt(i.value);x.day=d>=1&&d<=31?d:null}recalc();renderLite();document.querySelectorAll('[data-sum]').forEach(e=>e.textContent=fmt(S.fixed))});
 root.querySelectorAll('[data-fxdel]').forEach(b=>b.onclick=()=>{S.fixedItems.splice(+b.dataset.fxdel,1);recalc();renderLite();again()})}
function fxAdd(n){S.fixedItems.push({id:'f'+Date.now()+Math.random().toString(36).slice(2,5),n:n||'',a:0,day:null});recalc()}
/* --- enveloppes --- */
function envHTML(pre){return S.envs.map((e,k)=>`<div class="envr"><label for="${pre}e${k}">${e.i} ${esc(en(e))}</label><input id="${pre}e${k}" type="number" inputmode="numeric" min="0" max="100" step="1" value="${e.p}"><span>%</span></div>`).join('')+`<div class="sub"><span>${t('ep_sum')}</span><b id="${pre}es">${S.envs.reduce((s,e)=>s+e.p,0)} %</b></div><p class="lbl" id="${pre}eb" style="color:var(--bad)" role="alert"></p>`}
function envBind(pre){const g=()=>S.envs.map((e,k)=>parseFloat($(pre+'e'+k).value)||0),upd=()=>{const v=g(),s=v.reduce((a,b)=>a+b,0);$(pre+'es').textContent=s+' %';$(pre+'eb').textContent=s===100?'':t('ep_bad');return s===100?v:null};
 S.envs.forEach((e,k)=>{$(pre+'e'+k).oninput=upd;$(pre+'e'+k).onchange=()=>{const v=upd();if(v){S.envs.forEach((x,i)=>x.p=v[i]);save();renderLite()}}})}

function loanFormHTML(pre){return `<label for="${pre}n">${t('l_name')}</label><input id="${pre}n"><div class="two"><div><label for="${pre}p">${t('l_mpay')}</label><input id="${pre}p" type="text" inputmode="decimal" autocomplete="off" data-dec="1"></div><div><label for="${pre}b">${t('l_bal')}</label><input id="${pre}b" type="text" inputmode="decimal" autocomplete="off" data-dec="1"></div></div><div class="two"><div><label for="${pre}e">${t('l_endm')}</label><input id="${pre}e" type="month" placeholder="YYYY-MM"></div><div><label for="${pre}d">${t('l_day')}</label><input id="${pre}d" type="number" inputmode="numeric" min="1" max="31" placeholder="15"></div></div>`}
function loanAdd(pre){const v=id=>$(pre+id).value,n=v('n').trim(),p=parseFloat(v('p')),b=parseFloat(v('b')),e=v('e'),d=parseInt(v('d'))||15;if(!n&&!v('p')&&!v('b')&&!e)return 0;
 if(!(n&&p>0&&b>0&&/^\d{4}-\d{2}$/.test(e))){alert(t('l_bad'));return -1}
 const l={id:'l'+Date.now(),n,pay:p,bal:b,init:b,end:e,day:Math.min(31,Math.max(1,d)),lastPay:tdy().slice(0,7)};l.r=solveR(l);S.loans.push(l);recalc();return 1}
function renderLoans(){
 const rows=[...S.fixedItems.filter(x=>x.a>0).map(x=>[ico(x.n,'fx'),x.n,x.a]),...S.loans.filter(l=>l.bal>0).map(l=>[ico(l.n,'loan'),l.n,l.pay])];
 let h=`<h2>${t('fx_t')}</h2><div class="card">`+(rows.length?rows.map(r=>`<div class="li"><span>${r[0]} ${esc(r[1]||'—')}</span><b>${fmt(r[2])}</b></div>`).join('')+`<div class="li" style="border-top:2px solid var(--line)"><span><b>${t('fixed')}</b></span><b style="color:var(--bad)">${fmt(S.fixed)}</b></div>`:`<span class="lbl">${t('fx_none')}</span>`)+`<button class="sec w100" style="margin-top:var(--s2)" id="gofx">${t('fx_edit')}</button></div><h2>${t('l_t')}</h2>`;
 if(!S.loans.length)h+=`<div class="card"><span class="lbl">${t('l_none')}</span></div>`;
 S.loans.forEach(l=>{const p=l.init?(1-l.bal/l.init)*100:0,[y,m]=l.end.split('-');
  h+=`<div class="card"><div class="top"><span>${ico(l.n,'loan')} ${esc(l.n)}</span><span>${fmt(l.bal)}</span></div>${bar(p)}
  <div class="sub"><span>${p.toFixed(1)} % ${t('l_paid')}</span><span>${t('l_end')} ${new Date(y,m-1,1).toLocaleDateString(LOC[L],{month:'long',year:'numeric'})} (${monthsLeft(l.end)} ${t('l_mo')})</span></div>
  <div class="sub"><span>${t('l_due')} ${fmt(l.pay)} · ${t('rm_day_s')} ${l.day}</span><span>${t('l_rate')} ≈ ${(l.r*1200).toFixed(1)} %</span></div>
  <div class="row lr" style="margin-top:var(--s2)"><button class="sec" data-pay="${l.id}">${t('l_pay')}</button><button class="sec" data-bal="${l.id}">${t('l_fix')}</button><button class="sec" data-ldel="${l.id}">${t('l_del')}</button></div></div>`});
 h+=`<h2>${t('l_new')}</h2><div class="card">${loanFormHTML('lf_')}<button class="w100" id="lf_add">${t('l_add')}</button></div>`;
 $('t1').innerHTML=h;
 $('gofx').onclick=()=>{showTab(5);setTimeout(()=>{const e=$('fxbox');if(e)e.scrollIntoView({behavior:'smooth'})},120)};
 $('lf_add').onclick=()=>{if(loanAdd('lf_')===1){render();flash(t('s_ok'))}};
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{const l=S.loans.find(x=>x.id===b.dataset.pay),v=parseFloat(String(prompt(t('l_xp'),'')||'').replace(',','.'));if(v>0){l.bal=Math.max(0,+(l.bal-v).toFixed(2));l.r=solveR(l);recalc();render()}});
 document.querySelectorAll('[data-bal]').forEach(b=>b.onclick=()=>{const l=S.loans.find(x=>x.id===b.dataset.bal),v=parseFloat(String(prompt(t('l_prompt'),l.bal)||'').replace(',','.'));if(v>=0){l.bal=v;l.r=solveR(l);recalc();render()}});
 document.querySelectorAll('[data-ldel]').forEach(b=>b.onclick=()=>{if(confirm(t('l_del')+' ?')){S.loans=S.loans.filter(x=>x.id!==b.dataset.ldel);recalc();render()}})}

async function vEnable(code){
 const salt=crypto.getRandomValues(new Uint8Array(16)),key=await vDerive(code,salt,VLT.iter),chk=await vEnc(key,'DCPLN-OK'),plain=JSON.stringify(S);
 const jwk=await crypto.subtle.exportKey('jwk',key);
 try{localStorage.setItem(KEY,await vEnc(key,plain));localStorage.setItem(KEY+'_vlt',JSON.stringify({s:vb64(salt),i:VLT.iter,c:chk}))}catch(e){try{localStorage.setItem(KEY,plain);localStorage.removeItem(KEY+'_vlt')}catch(x){}throw e}
 sessionStorage.setItem(KEY+'_vk',JSON.stringify(jwk));sessionStorage.setItem(KEY+'_sess',plain);
 try{localStorage.removeItem('dcpln_v2')}catch(e){}
 VLT.on=true;VLT.key=key;VLT.locked=false}
async function vCheck(code){
 const m=JSON.parse(localStorage.getItem(KEY+'_vlt')||'null');if(!m)throw 0;
 if(!(m.i>=100000&&m.i<=2000000))throw 0;const key=await vDerive(code,vub(m.s),m.i);await vDec(key,m.c);return key}
async function vUnlockWith(code){
 const key=await vCheck(code),blob=localStorage.getItem(KEY),plain=await vDec(key,blob);
 sessionStorage.setItem(KEY+'_vk',JSON.stringify(await crypto.subtle.exportKey('jwk',key)));sessionStorage.setItem(KEY+'_sess',plain);location.reload()}

function appGuide(z){
 if(/\d/.test(z))return null;
 if(!/\b(ou|where|donde|comment|how|como|quoi|what|que|trouve|find|encuentro|activer|desactiver|enable|disable|activar|changer|change|cambiar|modifier|ajouter|add|anadir|corriger|supprimer|delete)\b/.test(z))return null;
 for(const g of GUIDE){if(new RegExp(g[0]).test(z)){
  const txt=Z(g[2][0],g[2][1],g[2][2]),tab=g[1],el=g[3];
  const o={t:txt};
  if(tab!==null)o.b=[{l:Z('Y aller','Take me there','Llévame'),f:()=>{showTab(tab);if(el)setTimeout(()=>{const c=$(el);if(c)c.scrollIntoView({behavior:'smooth',block:'center'})},200);return''}}];
  return o}}
 return null}
</script>
